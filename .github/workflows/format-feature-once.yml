name: one-time formatter

on:
  push:
    branches:
      - feat/ru-upstream-v4-hardening-20261118

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'orelkrylatiy/humanizer-framework' && github.ref == 'refs/heads/feat/ru-upstream-v4-hardening-20261118'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.5
      - name: Format and commit feature branch
        run: |
          ruff format .
          git diff --stat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply Ruff 0.16.5 formatting"
            git push origin "HEAD:refs/heads/feat/ru-upstream-v4-hardening-20261118"
          fi
