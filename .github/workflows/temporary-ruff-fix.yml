name: Temporary Ruff formatter
on:
  push:
    branches: [fix/ci-format-20261117]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.16.5
      - name: Format CI-blocking files
        run: |
          ruff format \
            src/humanizer_framework/framework.py \
            src/humanizer_framework/providers/cli.py \
            src/humanizer_framework/providers/harness.py \
            src/humanizer_framework/telemetry.py \
            tests/test_validators.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/humanizer_framework/framework.py \
            src/humanizer_framework/providers/cli.py \
            src/humanizer_framework/providers/harness.py \
            src/humanizer_framework/telemetry.py \
            tests/test_validators.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff formatting to CI paths"
            git push
          fi
